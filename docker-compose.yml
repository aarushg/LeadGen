services:
  leadgen:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadgen-app
    ports:
      - "3001:3001"
    volumes:
      - ./prisma/dev.db:/app/prisma/dev.db
    env_file:
      - path: .env.local
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
